services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vectordb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: curlimages/curl:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "until curl -s http://ollama:11434/api/tags | grep -q 'qwen2.5:7b' && curl -s http://ollama:11434/api/tags | grep -q 'nomic-embed-text'; do echo 'Waiting for models to be pulled...'; curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:7b\"}'; curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text\"}'; sleep 5; done" ]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama
    environment:
      - DATABASE_URL=postgresql://user:password@pgvector/vectordb
      - OLLAMA_BASE_URL=http://ollama:11434
      - API_URL=https://fakestoreapi.com/products # Example API
    volumes:
      - ./app:/app

volumes:
  postgres_data:
  ollama_data:
