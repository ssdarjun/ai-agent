model_list:
  - model_name: os.environ/QWEN_MODEL_NAME
    litellm_params:
      model: os.environ/OLLAMA_MODEL
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: os.environ/EMBEDDINGS_MODEL_NAME
    litellm_params:
      model: os.environ/OLLAMA_EMBEDDING_MODEL
      api_base: os.environ/OLLAMA_API_BASE
      drop_params: true
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
