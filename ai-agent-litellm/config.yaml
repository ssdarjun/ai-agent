# =============================================================================
# LiteLLM Model Config
# =============================================================================
#
# HOW TO ADD A NEW MODEL
# ──────────────────────
# 1. Copy the TEMPLATE block at the bottom of this file into model_list
# 2. Add the matching VLLM_NEWMODEL_* vars to .env
# 3. Restart LiteLLM: docker compose restart
# =============================================================================

model_list:

  # ── Chat + Document Generation: Qwen2.5-7B (vLLM port 8000) ──────────────
  # Use for: SOP writing, recommendation letters, structured text generation
  - model_name: os.environ/QWEN_MODEL_NAME
    litellm_params:
      model: os.environ/VLLM_CHAT_MODEL
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY

  # ── Vision + OCR: Qwen2.5-VL-7B (vLLM port 8002) ────────────────────────
  # Use for: Passport / ID card scanning, extracting fields from images & PDFs
  # API: same as chat/completions but include image_url in messages content
  - model_name: os.environ/VISION_MODEL_NAME
    litellm_params:
      model: os.environ/VLLM_VISION_MODEL
      api_base: os.environ/VLLM_VISION_API_BASE
      api_key: os.environ/VLLM_API_KEY

  # ── Embedding Model: nomic-embed-text (vLLM port 8001) ───────────────────
  # Use for: Semantic search over student profiles, document similarity
  - model_name: os.environ/EMBEDDINGS_MODEL_NAME
    litellm_params:
      model: os.environ/VLLM_EMBED_MODEL
      api_base: os.environ/VLLM_EMBED_API_BASE
      api_key: os.environ/VLLM_API_KEY
      drop_params: true
    model_info:
      mode: embedding

  # =============================================================================
  # TEMPLATE — copy this block above to add a new model
  # =============================================================================
  #
  # Chat / Vision model:
  # - model_name: os.environ/NEWMODEL_MODEL_NAME
  #   litellm_params:
  #     model: os.environ/VLLM_NEWMODEL_MODEL          ← openai/<alias>
  #     api_base: os.environ/VLLM_NEWMODEL_API_BASE    ← http://host.docker.internal:80XX/v1
  #     api_key: os.environ/VLLM_API_KEY
  #
  # Embedding model (add model_info block):
  # - model_name: os.environ/NEWMODEL_MODEL_NAME
  #   litellm_params:
  #     model: os.environ/VLLM_NEWMODEL_MODEL
  #     api_base: os.environ/VLLM_NEWMODEL_API_BASE
  #     api_key: os.environ/VLLM_API_KEY
  #     drop_params: true
  #   model_info:
  #     mode: embedding
  # =============================================================================

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 120
