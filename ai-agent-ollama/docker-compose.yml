services:
  ollama:
    image: ollama/ollama
    container_name: ai_agent_ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama-pull:
    image: curlimages/curl:latest
    container_name: ai_agent_ollama_pull
    depends_on:
      - ollama
    env_file:
      - .env
    entrypoint: >
      sh -c "
        until curl -s http://ollama:11434/api/tags | grep -q '$$MODEL_NAME' && curl -s http://ollama:11434/api/tags | grep -q '$$EMBED_MODEL'; do
          echo 'Waiting for models to be pulled...'
          curl -s -X POST http://ollama:11434/api/pull -d \"{\\\"name\\\": \\\"$$MODEL_NAME\\\"}\"
          curl -s -X POST http://ollama:11434/api/pull -d \"{\\\"name\\\": \\\"$$EMBED_MODEL\\\"}\"
          sleep 5
        done
      "

volumes:
  ollama_data:
