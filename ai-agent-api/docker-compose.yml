services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent_backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./app:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
